services:
  - type: web
    name: prince-store
    env: docker
    plan: free # Use Render's Free tier
    region: oregon # Default region
    envVars:
      # Render will dynamically override the PORT env var with its internal port (usually 10000)
      - key: PORT
        value: 8080
      
      # SQLite Database file location inside the container
      - key: SQLITE_DB_PATH
        value: /data/ecommerce.db

      # --- EMAIL CONFIGURATION (SMTP) ---
      # Set your real SMTP email & password to enable OTP features
      # Using Brevo SMTP on port 2525 is recommended on Render Free Tier to bypass port blocks.
      - key: EMAIL_USERNAME
        value: YOUR_BREVO_SMTP_LOGIN
      - key: EMAIL_PASSWORD
        value: YOUR_BREVO_SMTP_KEY
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: 2525

      # --- EXTERNAL DATABASE CONFIGURATION (Optional MySQL) ---
      # If you want to use an external MySQL database instead of the default SQLite fallback,
      # configure the DB_URL, DB_USERNAME, and DB_PASSWORD.
      # Or you can provide the single DATABASE_URL variable, and the app will parse it.
      #
      # - key: DB_URL
      #   value: jdbc:mysql://YOUR_MYSQL_HOST:3306/YOUR_DATABASE_NAME?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      # - key: DB_USERNAME
      #   value: YOUR_DATABASE_USERNAME
      # - key: DB_PASSWORD
      #   value: YOUR_DATABASE_PASSWORD

    # --- PERSISTENT STORAGE (Optional for SQLite) ---
    # Uncomment the block below to attach a persistent disk.
    # This prevents the SQLite database from resetting when the container restarts/redeploys.
    # Note: Persistent disks on Render are a paid feature (around $0.25/GB per month).
    #
    # disk:
    #   name: sqlite-data
    #   mountPath: /data
    #   sizeGB: 1
